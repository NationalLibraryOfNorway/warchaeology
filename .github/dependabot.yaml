version: 2
updates:
    - package-ecosystem: "gomod"
      directory: "/"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"
      commit-message:
          prefix: "build"
          include: "scope"

    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"
      commit-message:
          prefix: "build"
          include: "scope"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"
      commit-message:
          prefix: "build"
          include: "scope"

    - package-ecosystem: "npm"
      directory: "/website"
      schedule:
          interval: "weekly"
      groups:
          website-dependencies:
              applies-to: "version-updates"
              patterns:
                  - "*"
          website-security:
              applies-to: "security-updates"
              patterns:
                  - "*"
      labels:
          - "dependencies"
          - "javascript"
      commit-message:
          prefix: "build"
          include: "scope"
