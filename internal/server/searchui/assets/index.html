<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warchaeology · Archive console</title><link rel="stylesheet" href="console.css">
<body><header><span class="sigil" aria-hidden="true">◈</span><strong>WARCHAEOLOGY</strong><span class="label">ARCHIVE CONSOLE</span><span id="status" role="status">READY</span></header>
<main>
<form id="search" role="search"><input id="offset" name="offset" type="hidden" value="0"><label for="query">SEARCH THE ARCHIVE</label><div class="input-row"><input id="query" name="q" type="search" placeholder="Find a word, a story, a moment…" required autocomplete="off"><button>SEARCH <span aria-hidden="true">↗</span></button></div><details><summary>Filters</summary><label>Host <input name="host" placeholder="example.org"></label><label>Package <input name="package"></label><label>From <input id="filter-from" name="from" placeholder="RFC3339 UTC"></label><label>To <input id="filter-to" name="to" placeholder="RFC3339 UTC"></label><button type="button" id="clear-time">ALL TIME</button></details></form>
<section id="timeline" class="timeline" aria-label="Timeline of matching search results"><div class="timeline-heading"><span>CAPTURE SIGNAL</span><span id="range">Awaiting search</span><span id="count">0 CAPTURES</span></div><div id="ticks" class="ticks"></div><div class="timeline-heading"><span id="start">—</span><span>ALL MATCHES · SELECT AN INTERVAL TO FILTER</span><span id="end">—</span></div></section>
<div id="results" aria-live="polite"><div class="empty"><span aria-hidden="true">⌖</span><h1>Find your moment.</h1><p>Search preserved text. Follow the evidence back to its capture.</p></div></div>
<nav class="pagination" aria-label="Search result pages"><button type="button" id="previous" disabled>← PREVIOUS</button><span id="page-position"></span><button type="button" id="next" disabled>NEXT →</button></nav><dialog id="inspection"><form method="dialog"><button aria-label="Close inspector">×</button></form><h2>Capture provenance</h2><dl id="provenance"></dl></dialog>
</main><script src="console.js" defer></script></body></html>
